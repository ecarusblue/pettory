<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="주머니 속 작은 친구를 키우는 가상 반려 게임 (가칭)">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="펫토리">
  <meta name="theme-color" content="#E9F7EF">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>펫토리</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- 앱 셸 오프라인 캐시(app_sw.js)와 업데이트 확인. 푸시용 push_sw.js 는 ./push-scope/ 에 따로 등록되어 서로 독립. -->
  <script>
    // window.petoryUpdate: Dart(lib/data/app_updater_web.dart)가 쓰는 업데이트 API.
    //  - 빌드마다 달라지는 precache_manifest.json 의 해시를 app_sw.js?v=<해시> 로 등록해, 서비스 워커 파일이
    //    그대로여도 새 빌드를 감지한다(스크립트 URL 이 바뀌면 브라우저가 새 워커를 설치해 대기시킨다).
    //  - isReady()/onReady(cb): 새 버전이 설치돼 대기 중인가. apply(): 대기 워커를 즉시 적용하고 다시 불러온다.
    //  - force(): 앱 셸 서비스 워커와 petory- 캐시만 지우고 다시 불러온다(저장 데이터·푸시 구독은 건드리지 않는다).
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var sw = navigator.serviceWorker;
      var ready = false, listeners = [], reg = null;
      function setReady() {
        if (ready) return;
        ready = true;
        listeners.slice().forEach(function (f) { try { f(); } catch (e) {} });
      }
      function hash(str) {
        var h = 5381;
        for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
        return h.toString(36);
      }
      function watch(r) {
        reg = r;
        if (r.__petoryWatched) return;
        r.__petoryWatched = true;
        if (r.waiting && sw.controller) setReady();
        r.addEventListener('updatefound', function () {
          var w = r.installing;
          if (!w) return;
          w.addEventListener('statechange', function () {
            // 내용이 같은 워커는 설치 직후 스스로 활성화되므로(app_sw.js), 잠시 뒤에도 대기 중일 때만 새 버전으로 본다.
            if (w.state === 'installed' && sw.controller) {
              setTimeout(function () { if (r.waiting) setReady(); }, 1500);
            }
          });
        });
      }
      function check() {
        // 오프라인이거나 매니페스트가 없으면(개발 서버) 아무것도 하지 않는다(기존 등록 유지).
        return fetch('precache_manifest.json', { cache: 'no-cache' })
          .then(function (res) { return res.ok ? res.text() : Promise.reject(); })
          .then(function (text) { return sw.register('app_sw.js?v=' + hash(text)); })
          .then(watch)
          .catch(function () {});
      }
      function appRegistrations() {
        return sw.getRegistrations().then(function (regs) {
          return regs.filter(function (r) {
            return [r.active, r.waiting, r.installing].some(function (w) {
              return w && w.scriptURL.indexOf('app_sw.js') !== -1;
            });
          });
        });
      }
      window.petoryUpdate = {
        isReady: function () { return ready; },
        onReady: function (cb) { listeners.push(cb); },
        check: check,
        apply: function () {
          return new Promise(function (resolve) {
            var done = false;
            function reload() { if (!done) { done = true; location.reload(); resolve(); } }
            sw.addEventListener('controllerchange', reload);
            var w = reg && reg.waiting;
            if (w) w.postMessage('SKIP_WAITING'); else reload();
            setTimeout(reload, 4000);
          });
        },
        force: function () {
          return appRegistrations()
            .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
            .then(function () { return caches.keys(); })
            .then(function (keys) {
              return Promise.all(keys.filter(function (k) { return k.indexOf('petory-') === 0; })
                .map(function (k) { return caches.delete(k); }));
            })
            .catch(function () {})
            .then(function () { location.reload(); });
        }
      };
      window.addEventListener('load', function () {
        check();
        // 오래 켜 둔 앱도 새 버전을 알아채도록 30분마다, 그리고 앱으로 돌아올 때마다 확인한다.
        setInterval(check, 30 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      });
    })();
  </script>
</body>
</html>
